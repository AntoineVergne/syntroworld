  allowed_paths: [schemas/world.schema.json, synw/config.py, worlds/base.yaml, tests/test_config.py]
  acceptance:
    requirements: ["NO-STEP: parameters from 03 §10.1"]
    extra: ["pytest tests/test_config.py -q passes", "python -c \"import synw.config as c; c.load('worlds/base.yaml')\" exits 0"]
  tier_policy: none
  data_access: synthetic
  size: 0.5d
  budget: {tokens: 250k, wall_clock: 3h}
  blocked_by: [SYNW-001]

