# First SYNW tickets for the engine (mock brain only, no model calls).
# Smallest and most foundational first. Each is half a day or less.
# Paths follow source-docs/03-world-spec.md §9.

- key: SYNW-001
  name: "Package skeleton and test runner"
  unit: infra
  objective: "Create pyproject.toml (Python 3.11, deps: PyYAML, jsonschema, pytest), synw/__init__.py with __version__, .gitignore ignoring runs/, and tests/test_smoke.py that imports synw and checks __version__."
  allowed_paths: [pyproject.toml, .gitignore, synw/__init__.py, tests/test_smoke.py]
  acceptance:
    requirements: ["NO-STEP: repository bootstrap; no product behaviour yet"]
    extra: ["pip install -e . && pytest tests/test_smoke.py -q passes", "git ls-files contains no licence file and no licence header"]
  tier_policy: none
  data_access: synthetic
  size: 0.25d
  budget: {tokens: 120k, wall_clock: 1.5h}
  blocked_by: []

- key: SYNW-002
  name: "Named random streams"
  unit: engine
  objective: "synw/rng.py derives an independent PRNG per (seed, stream name) by hashing, per 03 §8, and tests/test_rng.py shows same seed and name give the same sequence and different names give different sequences."
  allowed_paths: [synw/rng.py, tests/test_rng.py]
  acceptance:
    requirements: ["NO-STEP: determinism foundation for 06 step M0"]
    extra: ["pytest tests/test_rng.py -q passes", "drawing from stream 'order' does not change the next value of stream 'world' (tested)"]
  tier_policy: none
  data_access: synthetic
  size: 0.25d
  budget: {tokens: 120k, wall_clock: 1.5h}
  blocked_by: [SYNW-001]

- key: SYNW-003
  name: "Append-only event log with canonical JSON"
  unit: engine
  objective: "synw/events.py writes a JSON Lines run log (header, events {tick, seq, type, actor, payload}, footer with state hash) using canonical JSON with sorted keys and integers only, and exposes log_hash(path); tests/test_events.py covers round-trip and rejects floats."
  allowed_paths: [synw/events.py, tests/test_events.py]
  acceptance:
    requirements: ["NO-STEP: event log contract from 03 §7"]
    extra: ["pytest tests/test_events.py -q passes", "writing the same events twice yields the same log_hash"]
  tier_policy: none
  data_access: synthetic
  size: 0.25d
  budget: {tokens: 120k, wall_clock: 1.5h}
  blocked_by: [SYNW-001]

- key: SYNW-004
  name: "World config schema and base parameters"
