  allowed_paths: [synw/world/__init__.py, synw/world/clock.py, synw/world/map.py, tests/test_clock_map.py]
  acceptance:
    requirements: ["NO-STEP: time and space from 03 §2 and the v0.1 map"]
    extra: ["pytest tests/test_clock_map.py -q passes"]
